<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Scan and Watch</title>
<style>
:root {
  --blue:#004EA8; --ink:#4A4744; --canvas:#F7F4F0; --surface:#FFFFFF; --outline:#DED8D0;
  --on-primary-container:#00306A; --primary-container:#CEDDF3;
  --font:"Raleway","Calibri",sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--canvas); color:var(--ink); font-family:var(--font);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
body { display:flex; flex-direction:column; padding:max(1.5rem, env(safe-area-inset-top)) 2rem max(1.5rem, env(safe-area-inset-bottom)); gap:1.25rem; }
h1 { margin:0; font-weight:800; font-size:clamp(2.5rem, 6vw, 4rem); line-height:1.1; color:var(--blue); }
p.hint { margin:0; font-size:1.5rem; line-height:1.4; max-width:34rem; }
main { flex:1; min-height:0; display:flex; flex-direction:column; gap:1.25rem; }
.stage { position:relative; flex:1; min-height:0; background:#000; border-radius:1.5rem; overflow:hidden; box-shadow:0 6px 24px rgb(0 0 0 / .12); }
.stage video, .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; background:#000; }
.frame { position:absolute; left:50%; top:50%; width:min(60%, 60vh); aspect-ratio:1; transform:translate(-50%,-50%);
  border:6px solid #fff; border-radius:1.5rem; box-shadow:0 0 0 100vmax rgb(0 0 0 / .35); pointer-events:none; }
button { font-family:var(--font); font-weight:800; font-size:1.75rem; min-height:4.5rem; padding:0 2.5rem; border:0; border-radius:999px;
  background:var(--blue); color:#fff; cursor:pointer; align-self:flex-start; }
button:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
.msg { background:var(--surface); border:1px solid var(--outline); border-radius:1rem; padding:1.25rem 1.5rem; font-size:1.5rem; line-height:1.4; }
[hidden] { display:none !important; }
@media (prefers-reduced-motion:no-preference) { .frame { transition:border-color .2s; } }
</style>
</head>
<body>
<section id="scanView" style="display:contents">
  <h1>Scan to watch</h1>
  <main>
    <div class="stage"><video id="cam" playsinline muted></video><div class="frame"></div></div>
    <p class="hint" id="status">Hold the iPad so the square code is inside the white box.</p>
    <div class="msg" id="problem" hidden></div>
  </main>
</section>

<section id="playView" style="display:contents" hidden>
  <main>
    <div class="stage" id="playStage"></div>
    <button id="again" type="button">Scan another</button>
  </main>
</section>

<canvas id="work" hidden></canvas>
<script src="common.js"></script>
<script>
(function () {
  var cam = document.getElementById('cam'), work = document.getElementById('work'), ctx = work.getContext('2d', { willReadFrequently:true });
  var scanView = document.getElementById('scanView'), playView = document.getElementById('playView');
  var playStage = document.getElementById('playStage'), status = document.getElementById('status'), problem = document.getElementById('problem');
  var stream = null, timer = null, lastBad = 0;

  function say(el, text) { el.textContent = text; el.hidden = false; }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }

  function play(id) {
    stop();
    scanView.hidden = true; scanView.style.display = 'none';
    playView.hidden = false; playView.style.display = 'contents';
    playStage.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = embedUrl(id);
    f.title = 'Video';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    /* No popups and no top navigation, so nothing in the player can send a student to YouTube or Safari. */
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
    playStage.appendChild(f);
  }

  function tick() {
    if (cam.readyState < 2 || !cam.videoWidth) return;
    var w = 480, h = Math.round(cam.videoHeight * w / cam.videoWidth);
    work.width = w; work.height = h;
    ctx.drawImage(cam, 0, 0, w, h);
    var img = ctx.getImageData(0, 0, w, h);
    var code = window.jsQR && jsQR(img.data, w, h, { inversionAttempts:'dontInvert' });
    if (!code || !code.data) return;
    var id = parseVideoId(code.data);
    if (id) { play(id); }
    else if (Date.now() - lastBad > 3000) {
      lastBad = Date.now();
      say(problem, 'That code is not one of our video codes. Try another one.');
    }
  }

  function start() {
    problem.hidden = true;
    status.textContent = 'Hold the iPad so the square code is inside the white box.';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say(problem, 'The camera is not working. Please ask your teacher.'); return;
    }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false })
      .then(function (s) {
        stream = s; cam.srcObject = s; return cam.play();
      })
      .then(function () { timer = setInterval(tick, 250); })
      .catch(function () { say(problem, 'Please tap Allow when the iPad asks to use the camera. If it does not ask, tell your teacher.'); });
  }

  document.getElementById('again').addEventListener('click', function () {
    playStage.innerHTML = '';
    playView.hidden = true; playView.style.display = 'none';
    scanView.hidden = false; scanView.style.display = 'contents';
    start();
  });
  /* Stop students bouncing or zooming the page. */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  playView.hidden = true; playView.style.display = 'none';
  loadLib('jsQR.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js')
    .then(start)
    .catch(function () { say(problem, 'This page could not load. Please ask your teacher.'); });
})();
</script>
</body>
</html>
