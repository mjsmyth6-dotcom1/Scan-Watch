<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Watch at ISWA</title>
<style>
:root {
  --blue:#004EA8; --ink:#4A4744; --canvas:#F7F4F0; --surface:#FFFFFF; --outline:#DED8D0;
  --font:"Raleway","Calibri",sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--canvas); color:var(--ink); font-family:var(--font);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
body { display:flex; flex-direction:column; padding:max(1.5rem, env(safe-area-inset-top)) 2rem max(1.5rem, env(safe-area-inset-bottom)); gap:1.25rem; }
.logo { display:block; height:clamp(2.25rem,5vw,3.25rem); width:auto; align-self:flex-start; }
h1 { margin:0; font-weight:800; font-size:clamp(2.5rem, 6vw, 4rem); line-height:1.1; color:var(--blue); }
p.hint { margin:0; font-size:1.5rem; line-height:1.4; max-width:34rem; }
main { flex:1; min-height:0; display:flex; flex-direction:column; gap:1.25rem; }
.stage { position:relative; flex:1; min-height:0; background:#000; border-radius:1.5rem; overflow:hidden; box-shadow:0 6px 24px rgb(0 0 0 / .12); }
.stage video { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; background:#000; }
.slidebox { position:absolute; overflow:hidden; }
.slidebox iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
/* Invisible layer over the bottom row of the video player (More videos, link and YouTube logo), so those buttons cannot be tapped. */
.cover { position:absolute; left:0; right:0; bottom:0; z-index:1; }
.cover.debug { background:rgb(255 0 0 / .35); }
.frame { position:absolute; left:50%; top:50%; width:min(60%, 60vh); aspect-ratio:1; transform:translate(-50%,-50%);
  border:6px solid #fff; border-radius:1.5rem; box-shadow:0 0 0 100vmax rgb(0 0 0 / .35); pointer-events:none; }
button { font-family:var(--font); font-weight:800; font-size:1.75rem; min-height:4.5rem; padding:0 2.5rem; border:0; border-radius:999px;
  background:var(--blue); color:#fff; cursor:pointer; align-self:flex-start; }
button:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
.msg { background:var(--surface); border:1px solid var(--outline); border-radius:1rem; padding:1.25rem 1.5rem; font-size:1.5rem; line-height:1.4; }
[hidden] { display:none !important; }
@media (prefers-reduced-motion:no-preference) { .frame { transition:border-color .2s; } }
</style>
</head>

    var w = Math.min(W, H * 16 / 9), h = w * 9 / 16;
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.left = ((W - w) / 2) + 'px'; box.style.top = ((H - h) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(playStage);

  function slideUrl(slideId) {
    return 'https://docs.google.com/presentation/d/e/' + PUBLISHED_ID + '/embed?start=false&loop=false&delayms=3000&rm=minimal&slide=id.' + slideId;
  }

  function show(slideId) {
    playStage.innerHTML = '';
    box = document.createElement('div');
    box.className = 'slidebox';
    var f = document.createElement('iframe');
    f.title = 'Video';
    f.allow = 'autoplay; encrypted-media';
    /* No popups and no navigation out of this page, so nothing in the player can send a student to YouTube. */
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
    f.src = slideUrl(slideId);
    var c = document.createElement('div');
    c.className = 'cover' + ('debug' in qs ? ' debug' : '');
    c.style.height = cover + 'px';
    c.setAttribute('aria-hidden', 'true');
    box.appendChild(f); box.appendChild(c);
    playStage.appendChild(box);
    fit();
  }

  function play(slideId) {
    stop();
    scanView.hidden = true; scanView.style.display = 'none';
    playView.hidden = false; playView.style.display = 'contents';
    show(slideId);
  }

  function tick() {
    if (cam.readyState < 2 || !cam.videoWidth) return;
    var w = 640, h = Math.round(cam.videoHeight * w / cam.videoWidth);
    work.width = w; work.height = h;
    ctx.drawImage(cam, 0, 0, w, h);
    var img = ctx.getImageData(0, 0, w, h);
    var text = decodeQR(img.data, w, h);
    if (!text) return;
    var id = parseSlideId(text);
    if (id) { play(id); return; }
    if (Date.now() - lastBad > 3000) {
      lastBad = Date.now();
      if (/^video:|youtu/i.test(text)) say(problem, 'That card is from an older set. Please ask your teacher for a new one.');
      else say(problem, 'That code is not one of our video codes. Try another one.');
    }
  }

  function start() {
    problem.hidden = true;
    status.textContent = 'Hold the iPad so the square code is inside the white box.';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say(problem, 'The camera is not working. Please ask your teacher.'); return;
    }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false })
      .then(function (s) {
        stream = s; cam.srcObject = s; return cam.play();
      })
      .then(function () { timer = setInterval(tick, 250); })
      .catch(function () { say(problem, 'Please tap Allow when the iPad asks to use the camera. If it does not ask, tell your teacher.'); });
  }

  document.getElementById('again').addEventListener('click', function () {
    playStage.innerHTML = ''; box = null;
    playView.hidden = true; playView.style.display = 'none';
    scanView.hidden = false; scanView.style.display = 'contents';
    start();
  });
  /* Stop students bouncing or zooming the page. */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  var direct = parseSlideId('slide:' + (qs.slide || ''));
  if (direct) { play(direct); }
  else { playView.hidden = true; playView.style.display = 'none'; start(); }
})();
</script>
</body>
</html>
